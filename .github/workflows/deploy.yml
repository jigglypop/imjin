name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  BUCKET: imjin1592.com
  DISTRIBUTION: EARA00UGW51K0
  ROLE: arn:aws:iam::960243570517:role/imjin1592-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # The multiplayer server (scripts/deploy-mp.sh). Skipped until the repository variable MP_INSTANCE_ID is set. It goes
      # out before the site: a PROTOCOL bump must reach the server first, or new pages meet an old server. A failed server
      # deploy only warns, so the site still ships.
      - name: Deploy multiplayer server
        if: vars.MP_INSTANCE_ID != ''
        continue-on-error: true
        env:
          INSTANCE: ${{ vars.MP_INSTANCE_ID }}
        run: |
          npm run server:build
          aws s3 cp server/dist/server.cjs s3://imjin1592-deploy/server/server.cjs --only-show-errors
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --parameters 'commands=["/usr/local/bin/imjin-deploy"]' --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE"
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 https://mp.imjin1592.com/health && exit 0
            sleep 5
          done
          echo "::warning::multiplayer server did not answer /health after the deploy"
          exit 1

      - name: Upload hashed bundles
        run: aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"

      - name: Upload static assets
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --size-only \
            --exclude "index.html" --exclude "assets/*" --exclude "*.glb" --exclude "en" --exclude "en/" --exclude "en/index.html" \
            --cache-control "public,max-age=86400"
          aws s3 sync dist "s3://$BUCKET" --size-only \
            --exclude "*" --include "*.glb" \
            --content-type "model/gltf-binary" --cache-control "public,max-age=86400"

      - name: Upload index
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          # The English edition answers at /en, /en/ and /en/index.html (the origin has no directory index).
          aws s3 cp dist/en/index.html "s3://$BUCKET/en/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          aws s3api put-object --bucket "$BUCKET" --key en --body dist/en/index.html --content-type "text/html; charset=utf-8" --cache-control "no-cache" >/dev/null
          aws s3api put-object --bucket "$BUCKET" --key en/ --body dist/en/index.html --content-type "text/html; charset=utf-8" --cache-control "no-cache" >/dev/null

      - name: Invalidate CDN
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
