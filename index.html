    <link rel="preload" href="/ui/fonts/jeongmukbawi-regular.woff" as="font" type="font/woff" crossorigin media="(min-width: 900px)" />

      html,
      body {
        margin: 0;

      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS Safari pinch-zooms the page through gesture events even when touch-action is none.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) {
          e.preventDefault();
        });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
