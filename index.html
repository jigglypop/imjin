<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>임진 해전 · Imjin War at Sea</title>
    <meta name="description" content="1592, 조선 수군의 바다. 3D 해전 전략 게임. A 3D naval strategy game about the Imjin War." />
    <meta name="theme-color" content="#050b13" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="임진 해전" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- A serif for hanja marks only (wordmark, order icons). It loads without blocking first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap" media="print" onload="this.media = 'all'" />
    <style>
      html,
      body {
        margin: 0;
        background: #050b13;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS Safari pinch-zooms the page through gesture events even when touch-action is none.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) {
          e.preventDefault();
        });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
